<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarmas & Recordatorios</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {

            brand: {

              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#0f172a',
              800: '#1e293b',
              700_dark: '#334155'
            }
          }
        }
      }
    }
  </script>

  <!-- Phosphor Icons para iconografía moderna -->

  <style>
    /* Transiciones personalizadas */
    .fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Scrollbar estilizada */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white pb-12">

  <!-- Header principal -->
  <header class="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
          <i class="ph-bold ph-alarm text-2xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-white">Recordatorios</h1>
          <p class="text-xs text-slate-400">PWA & Alarmas Inteligentes</p>
        </div>
      </div>

      <!-- Acciones de Header (Instalar App & Estado Notificaciones) -->
      <div class="flex items-center gap-2">
        <button id="btnPermission" onclick="requestNotificationPermission()" class="hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all">
          <i class="ph-bold ph-bell"></i>
          <span id="permStatusText">Permitir Notificaciones</span>
        </button>

        <button id="installBtn" class="hidden items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/20 transition-all active:scale-95">
          <i class="ph-bold ph-download-simple text-sm"></i>
          <span>Instalar App</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full px-4 pt-6 flex-1 grid grid-cols-1 md:grid-cols-12 gap-6">

    <!-- Panel Izquierdo: Reloj, Próxima Alarma y Formulario -->
    <section class="md:col-span-5 flex flex-col gap-5">
      
      <!-- Widget Reloj Dinámico & Próxima Alarma -->
      <div class="bg-slate-800/90 border border-slate-700/60 rounded-2xl p-5 shadow-xl relative overflow-hidden">
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>
        
        <div class="flex items-center justify-between text-slate-400 text-xs font-medium mb-1">
          <span id="currentDate">Cargando fecha...</span>
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            En vivo
          </span>
        </div>

        <div id="clock" class="text-4xl sm:text-5xl font-black tracking-tight text-white font-mono my-1">
          00:00:00
        </div>

        <!-- Banner de Próxima Alarma -->
        <div class="mt-4 pt-3 border-t border-slate-700/50 flex items-center justify-between text-xs">
          <div class="flex items-center gap-2 text-slate-300">
            <i class="ph-bold ph-timer text-indigo-400 text-base"></i>
            <div>
              <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider">Próximo aviso</span>
              <span id="nextAlarmTitle" class="font-semibold truncate max-w-[150px] inline-block">Sin alarmas</span>
            </div>
          </div>
          <div id="nextAlarmCountdown" class="text-right font-mono text-indigo-400 font-bold bg-indigo-950/60 border border-indigo-800/50 px-2.5 py-1 rounded-md">
            --:--
          </div>
        </div>
      </div>

      <!-- Formulario para Agregar/Editar Recordatorio -->
      <div class="bg-slate-800/90 border border-slate-700/60 rounded-2xl p-5 shadow-xl">
        <div class="flex items-center justify-between mb-4">
          <h2 id="formTitle" class="font-bold text-base flex items-center gap-2 text-white">
            <i class="ph-bold ph-plus-circle text-indigo-400"></i>
            Nuevo Recordatorio
          </h2>
          <button id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs text-slate-400 hover:text-white underline">
            Cancelar edición
          </button>
        </div>

        <form id="reminderForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <input type="hidden" id="editId" value="">

          <div>
            <label for="title" class="block text-xs font-semibold text-slate-300 mb-1">Título del recordatorio</label>
            <input type="text" id="title" required placeholder="Ej. Tomar medicina, Reunión de equipo..." 
              class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="date" class="block text-xs font-semibold text-slate-300 mb-1">Fecha</label>
              <input type="date" id="date" required 
                class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
            </div>
            <div>
              <label for="time" class="block text-xs font-semibold text-slate-300 mb-1">Hora</label>
              <input type="time" id="time" required 
                class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Categoría / Prioridad</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="cursor-pointer">
                <input type="radio" name="category" value="Trabajo" class="peer sr-only" checked>
                <div class="peer-checked:border-blue-500 peer-checked:bg-blue-500/10 peer-checked:text-blue-400 border border-slate-700 bg-slate-900/50 rounded-lg p-2 text-center text-xs font-medium text-slate-400 hover:bg-slate-700/50 transition-all flex items-center justify-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-blue-500"></span> Trabajo
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="category" value="Personal" class="peer sr-only">
                <div class="peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 peer-checked:text-emerald-400 border border-slate-700 bg-slate-900/50 rounded-lg p-2 text-center text-xs font-medium text-slate-400 hover:bg-slate-700/50 transition-all flex items-center justify-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Personal
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="category" value="Salud" class="peer sr-only">
                <div class="peer-checked:border-purple-500 peer-checked:bg-purple-500/10 peer-checked:text-purple-400 border border-slate-700 bg-slate-900/50 rounded-lg p-2 text-center text-xs font-medium text-slate-400 hover:bg-slate-700/50 transition-all flex items-center justify-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-purple-500"></span> Salud
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="category" value="Importante" class="peer sr-only">
                <div class="peer-checked:border-rose-500 peer-checked:bg-rose-500/10 peer-checked:text-rose-400 border border-slate-700 bg-slate-900/50 rounded-lg p-2 text-center text-xs font-medium text-slate-400 hover:bg-slate-700/50 transition-all flex items-center justify-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-rose-500"></span> Importante
                </div>
              </label>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/25 transition-all flex items-center justify-center gap-2">
            <i class="ph-bold ph-floppy-disk text-base"></i>
            <span>Guardar Recordatorio</span>
          </button>
        </form>
      </div>
    </section>

    <!-- Panel Derecho: Filtros y Lista de Recordatorios -->
    <section class="md:col-span-7 flex flex-col gap-4">
      
      <!-- Barra superior de filtros -->
      <div class="bg-slate-800/90 border border-slate-700/60 rounded-2xl p-3 flex flex-wrap items-center justify-between gap-2 shadow-md">
        <div class="flex items-center gap-1 bg-slate-900/80 p-1 rounded-xl border border-slate-700/60">
          <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition-all">
            Todos (<span id="cnt-all">0</span>)
          </button>
          <button onclick="setFilter('pending')" id="filter-pending" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all">
            Pendientes (<span id="cnt-pending">0</span>)
          </button>
          <button onclick="setFilter('completed')" id="filter-completed" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all">
            Completados (<span id="cnt-completed">0</span>)
          </button>
        </div>

        <button onclick="testSound()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1 px-2.5 py-1.5 rounded-lg hover:bg-slate-700/50 transition-all">
          <i class="ph-bold ph-speaker-high text-sm"></i>
          Probar Sonido
        </button>
      </div>

      <!-- Listado de recordatorios -->
      <div id="reminderContainer" class="space-y-3 flex-1 overflow-y-auto max-h-[600px] pr-1">
        <!-- Generado dinámicamente -->
      </div>
    </section>

  </main>

  <!-- Modal / Overlay de Alarma Activa -->
  <div id="alarmModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md hidden flex items-center justify-center p-4 fade-in">
    <div class="bg-slate-900 border border-indigo-500/50 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl shadow-indigo-500/20 relative overflow-hidden">
      <div class="absolute -top-16 -left-16 w-32 h-32 bg-indigo-500/20 rounded-full blur-3xl"></div>
      
      <div class="w-20 h-20 bg-indigo-600/20 border-2 border-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-400 animate-bounce">
        <i class="ph-bold ph-bell-ringing text-4xl"></i>
      </div>

      <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-rose-500/20 text-rose-400 border border-rose-500/30 inline-block mb-2">
        ¡Alarma Sonando!
      </span>

      <h3 id="alarmModalTitle" class="text-xl font-black text-white mb-1">Título del recordatorio</h3>
      <p id="alarmModalTime" class="text-xs text-slate-400 mb-6">Programado para hoy a las 00:00</p>

      <button onclick="stopAlarm()" class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-extrabold rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
        <i class="ph-bold ph-check-circle text-lg"></i>
        <span>Detener / Entendido</span>
      </button>
    </div>
  </div>

  <!-- JavaScript Lógica de la App -->
  <script>
    // Variable global para almacenaje
    let reminders = JSON.parse(localStorage.getItem('pwa_reminders')) || [];
    let currentFilter = 'all';
    let deferredPrompt = null;
    let activeOscillators = [];
    let audioCtx = null;
    let alarmCheckInterval = null;

    // Colores e Iconos según categoría
    const categoryStyles = {
      Trabajo: { bg: 'bg-blue-500/10', text: 'text-blue-400', border: 'border-blue-500/30', dot: 'bg-blue-500' },
      Personal: { bg: 'bg-emerald-500/10', text: 'text-emerald-400', border: 'border-emerald-500/30', dot: 'bg-emerald-500' },
      Salud: { bg: 'bg-purple-500/10', text: 'text-purple-400', border: 'border-purple-500/30', dot: 'bg-purple-500' },
      Importante: { bg: 'bg-rose-500/10', text: 'text-rose-400', border: 'border-rose-500/30', dot: 'bg-rose-500' }
    };

    // --- INICIALIZACIÓN ---
    window.addEventListener('DOMContentLoaded', () => {
      initServiceWorker();
      initClockAndLoop();
      setDefaultDateTime();
      renderReminders();
      checkNotificationStatus();
    });

    // --- PWA: SERVICE WORKER & INSTALACIÓN ---
    function initServiceWorker() {
      if ('serviceWorker' in navigator) {
        // Service Worker inline via Blob URL
        const swCode = `
          const CACHE_NAME = 'reminder-pwa-v1';
          self.addEventListener('install', (e) => {
            self.skipWaiting();
          });
          self.addEventListener('activate', (e) => {
            e.waitUntil(clients.claim());
          });
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);

        navigator.serviceWorker.register(swUrl)
          .then(() => console.log('Service Worker PWA Registrado'))
          .catch(err => console.log('Error SW:', err));
      }
    }

    // Evento de instalación PWA
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('installBtn');
      installBtn.classList.remove('hidden');
      installBtn.classList.add('flex');
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        document.getElementById('installBtn').classList.add('hidden');
      }
      deferredPrompt = null;
    });

    // --- NOTIFICACIONES Y PERMISOS ---
    function checkNotificationStatus() {
      const btn = document.getElementById('btnPermission');
      const text = document.getElementById('permStatusText');
      if (!('Notification' in window)) {
        btn.classList.add('hidden');
        return;
      }
      if (Notification.permission === 'granted') {
        text.innerText = 'Notificaciones Activas';
        btn.classList.add('text-emerald-400', 'border-emerald-500/30');
      } else if (Notification.permission === 'denied') {
        text.innerText = 'Notificaciones Bloqueadas';
        btn.classList.add('text-rose-400');
      }
    }

    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(() => {
          checkNotificationStatus();
        });
      }
    }

    // --- RELOJ Y MOTOR EN TIEMPO REAL ---
    function initClockAndLoop() {
      const clockEl = document.getElementById('clock');
      const dateEl = document.getElementById('currentDate');

      function updateClock() {
        const now = new Date();
        
        // Formato Hora
        clockEl.textContent = now.toLocaleTimeString('es-ES', { hour12: false });
        
        // Formato Fecha
        const options = { weekday: 'short', day: 'numeric', month: 'short' };
        dateEl.textContent = now.toLocaleDateString('es-ES', options);

        // Verificar Alarmas
        checkAlarms(now);

        // Actualizar Cuenta Regresiva de la próxima alarma
        updateCountdown(now);
      }

      updateClock();
      setInterval(updateClock, 1000);
    }

    function setDefaultDateTime() {
      const now = new Date();
      now.setMinutes(now.getMinutes() + 5); // Por defecto +5 min
      document.getElementById('date').value = now.toISOString().split('T')[0];
      document.getElementById('time').value = now.toTimeString().substring(0, 5);
    }

    // --- MANEJO DE ALARMAS Y SONIDO ---
    function checkAlarms(now) {
      const currentDateStr = now.toISOString().split('T')[0];
      const currentTimeStr = now.toTimeString().substring(0, 5);

      reminders.forEach(item => {
        if (!item.completed && !item.triggered && item.date === currentDateStr && item.time === currentTimeStr) {
          item.triggered = true;
          saveToLocalStorage();
          triggerAlarm(item);
          renderReminders();
        }
      });
    }

    function triggerAlarm(item) {
      // 1. Reproducir Patrón de Alarma con Web Audio API
      playAlarmSound();

      // 2. Notificación Nativa Escritorio/Móvil
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(`⏰ ¡RECORDATORIO: ${item.title}!`, {
          body: `Categoría: ${item.category}\nHora: ${item.time}`,
          icon: 'https://cdn-icons-png.flaticon.com/512/3602/3602145.png'
        });
      }

      // 3. Mostrar Modal de pantalla completa
      document.getElementById('alarmModalTitle').textContent = item.title;
      document.getElementById('alarmModalTime').textContent = `Programado para ${item.date} a las ${item.time}`;
      document.getElementById('alarmModal').classList.remove('hidden');
    }

    // Sintetizador Web Audio API para tono de alarma dinámico
    function playAlarmSound() {
      stopAlarmSound(); // Detener cualquier sonido previo
      
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      audioCtx = new AudioCtx();

      // Crear patrón Beep-Beep-Beep cíclico
      const playBeep = () => {
        if (!audioCtx || audioCtx.state === 'closed') return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Nota A5
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);

        activeOscillators.push(osc);
      };

      playBeep();
      alarmCheckInterval = setInterval(playBeep, 600);
    }

    function stopAlarmSound() {
      if (alarmCheckInterval) {
        clearInterval(alarmCheckInterval);
        alarmCheckInterval = null;
      }
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      activeOscillators = [];
    }

    function stopAlarm() {
      stopAlarmSound();
      document.getElementById('alarmModal').classList.add('hidden');
    }

    function testSound() {
      playAlarmSound();
      setTimeout(stopAlarmSound, 1500);
    }

    // --- ACTUALIZAR CUENTA REGRESIVA ---
    function updateCountdown(now) {
      const pendingReminders = reminders
        .filter(r => !r.completed)
        .map(r => ({ ...r, dateTime: new Date(`${r.date}T${r.time}:00`) }))
        .filter(r => r.dateTime > now)
        .sort((a, b) => a.dateTime - b.dateTime);

      const titleEl = document.getElementById('nextAlarmTitle');
      const countEl = document.getElementById('nextAlarmCountdown');

      if (pendingReminders.length === 0) {
        titleEl.textContent = 'Sin próximas alarmas';
        countEl.textContent = '--:--';
        return;
      }

      const next = pendingReminders[0];
      const diffMs = next.dateTime - now;
      const diffMin = Math.floor(diffMs / 60000);
      const diffSec = Math.floor((diffMs % 60000) / 1000);

      titleEl.textContent = next.title;

      if (diffMin > 60) {
        const hours = Math.floor(diffMin / 60);
        const mins = diffMin % 60;
        countEl.textContent = `${hours}h ${mins}m`;
      } else {
        countEl.textContent = `${String(diffMin).padStart(2, '0')}:${String(diffSec).padStart(2, '0')}`;
      }
    }

    // --- GESTIÓN DE RECORDATORIOS (CRUD) ---
    function handleFormSubmit(e) {
      e.preventDefault();

      const editId = document.getElementById('editId').value;
      const title = document.getElementById('title').value.trim();
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const category = document.querySelector('input[name="category"]:checked').value;

      if (editId) {
        // Modo Edición
        reminders = reminders.map(r => r.id === editId ? { ...r, title, date, time, category, triggered: false } : r);
      } else {
        // Nuevo Recordatorio
        const newReminder = {
          id: Date.now().toString(),
          title,
          date,
          time,
          category,
          completed: false,
          triggered: false,
          createdAt: new Date().toISOString()
        };
        reminders.unshift(newReminder);
      }

      saveToLocalStorage();
      resetForm();
      renderReminders();
    }

    function editReminder(id) {
      const item = reminders.find(r => r.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('title').value = item.title;
      document.getElementById('date').value = item.date;
      document.getElementById('time').value = item.time;
      
      const categoryRadio = document.querySelector(`input[name="category"][value="${item.category}"]`);
      if (categoryRadio) categoryRadio.checked = true;

      document.getElementById('formTitle').innerHTML = `<i class="ph-bold ph-pencil-simple text-indigo-400"></i> Editar Recordatorio`;
      document.getElementById('submitBtn').innerHTML = `<i class="ph-bold ph-check text-base"></i> <span>Actualizar</span>`;
      document.getElementById('cancelEditBtn').classList.remove('hidden');
    }

    function resetForm() {
      document.getElementById('editId').value = '';
      document.getElementById('reminderForm').reset();
      setDefaultDateTime();
      document.getElementById('formTitle').innerHTML = `<i class="ph-bold ph-plus-circle text-indigo-400"></i> Nuevo Recordatorio`;
      document.getElementById('submitBtn').innerHTML = `<i class="ph-bold ph-floppy-disk text-base"></i> <span>Guardar Recordatorio</span>`;
      document.getElementById('cancelEditBtn').classList.add('hidden');
    }

    function toggleComplete(id) {
      reminders = reminders.map(r => r.id === id ? { ...r, completed: !r.completed } : r);
      saveToLocalStorage();
      renderReminders();
    }

    function deleteReminder(id) {
      reminders = reminders.filter(r => r.id !== id);
      saveToLocalStorage();
      renderReminders();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`filter-${filter}`);
      activeBtn.classList.add('bg-indigo-600', 'text-white');
      activeBtn.classList.remove('text-slate-400');

      renderReminders();
    }

    function saveToLocalStorage() {
      localStorage.setItem('pwa_reminders', JSON.stringify(reminders));
    }

    // --- RENDERIZADO DINÁMICO ---
    function renderReminders() {
      const container = document.getElementById('reminderContainer');
      container.innerHTML = '';

      // Contadores
      const allCount = reminders.length;
      const pendingCount = reminders.filter(r => !r.completed).length;
      const completedCount = reminders.filter(r => r.completed).length;

      document.getElementById('cnt-all').textContent = allCount;
      document.getElementById('cnt-pending').textContent = pendingCount;
      document.getElementById('cnt-completed').textContent = completedCount;

      // Filtrado
      let filtered = reminders;
      if (currentFilter === 'pending') filtered = reminders.filter(r => !r.completed);
      if (currentFilter === 'completed') filtered = reminders.filter(r => r.completed);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-8 text-center text-slate-500">
            <i class="ph-bold ph-tray text-4xl mb-2 text-slate-600 inline-block"></i>
            <p class="text-sm">No hay recordatorios ${currentFilter === 'all' ? '' : currentFilter === 'pending' ? 'pendientes' : 'completados'}.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const catStyle = categoryStyles[item.category] || categoryStyles.Trabajo;
        const isPast = new Date(`${item.date}T${item.time}:00`) < new Date() && !item.completed;

        const card = document.createElement('div');
        card.className = `bg-slate-800/90 border ${item.completed ? 'border-slate-800 opacity-60' : isPast ? 'border-amber-500/40' : 'border-slate-700/60'} rounded-2xl p-4 shadow-md transition-all flex items-center justify-between gap-3 fade-in hover:border-slate-600`;

        card.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            <button onclick="toggleComplete('${item.id}')" class="w-6 h-6 rounded-lg border ${item.completed ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-600 hover:border-indigo-400 text-transparent'} flex items-center justify-center transition-all flex-shrink-0">
              <i class="ph-bold ph-check text-xs"></i>
            </button>

            <div class="min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <h3 class="font-bold text-sm text-white truncate ${item.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(item.title)}</h3>
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-semibold ${catStyle.bg} ${catStyle.text} border ${catStyle.border} flex-shrink-0">
                  <span class="w-1.5 h-1.5 rounded-full ${catStyle.dot}"></span>
                  ${item.category}
                </span>
              </div>

              <div class="flex items-center gap-3 text-xs text-slate-400">
                <span class="flex items-center gap-1">
                  <i class="ph-bold ph-calendar-blank text-slate-500"></i> ${item.date}
                </span>
                <span class="flex items-center gap-1 font-mono ${isPast ? 'text-amber-400 font-bold' : ''}">
                  <i class="ph-bold ph-clock text-slate-500"></i> ${item.time} ${isPast ? '(Atrasado)' : ''}
                </span>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-1 flex-shrink-0">
            <button onclick="editReminder('${item.id}')" class="p-2 text-slate-400 hover:text-indigo-400 hover:bg-slate-700/50 rounded-lg transition-all" title="Editar">
              <i class="ph-bold ph-pencil-simple text-base"></i>
            </button>
            <button onclick="deleteReminder('${item.id}')" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-700/50 rounded-lg transition-all" title="Eliminar">
              <i class="ph-bold ph-trash text-base"></i>
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
